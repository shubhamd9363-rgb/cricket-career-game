
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beyond the Boundary | Cricket Career</title>
<style>
:root{--bg:#090d1b;--panel:#141b31;--line:#303b60;--green:#63f2d0;--gold:#ffbf69;--muted:#aab5d0;--white:#f5f7ff;--violet:#a18bff;--blue:#6ca9ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 12% 0%,#202b52 0,transparent 36%),radial-gradient(ellipse at 100% 20%,#172d43 0,transparent 30%),var(--bg);color:var(--white);font:15px/1.45 Inter,ui-sans-serif,system-ui,Arial,sans-serif;min-height:100vh}
header{padding:28px 18px;background:linear-gradient(115deg,rgba(35,48,91,.96),rgba(10,15,31,.96) 65%,rgba(16,57,70,.9));border-bottom:1px solid var(--line);box-shadow:0 12px 40px #0003;position:relative;overflow:hidden}header:after{content:"";position:absolute;right:-45px;top:-100px;width:260px;height:260px;border:1px solid #63f2d033;border-radius:50%;box-shadow:0 0 0 28px #63f2d010,0 0 0 58px #a18bff0c;pointer-events:none}
h1{font-size:24px;margin:0 0 5px}h2{font-size:19px;margin:0 0 14px}h3{font-size:15px;margin:0 0 8px}
p{line-height:1.5}.muted{color:var(--muted);font-size:13px}
.wrap{max-width:1240px;margin:auto;padding:18px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0}
.stat,.panel{background:linear-gradient(145deg,rgba(24,32,57,.97),rgba(16,23,42,.97));border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;box-shadow:0 8px 24px #0002}
.stat b{display:block;font-size:19px;color:var(--green);margin-top:5px;overflow-wrap:anywhere}.stat{background:linear-gradient(135deg,#1a2747,#151c32)}
nav{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}
button,select,input{font:inherit;border-radius:10px;padding:11px;background:#202b49;color:var(--white);border:1px solid #3b4a70}
button{cursor:pointer;font-weight:650}
button{transition:transform .15s ease,border-color .15s ease,background .15s ease}button:hover{border-color:var(--green);transform:translateY(-1px)}button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.primary{background:linear-gradient(120deg,var(--green),#8ef7b1);color:#081b27;border:0;box-shadow:0 5px 18px #63f2d01e}
.active{border-color:var(--green);color:var(--green);background:#18394a}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stack{display:grid;gap:10px}
label{display:grid;gap:6px;color:var(--muted);font-size:13px}
input,select{width:100%}
.bar{height:7px;background:#263b30;border-radius:10px;overflow:hidden;margin:6px 0 12px}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--green));border-radius:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button{flex:1}
.score{font-size:32px;font-weight:850;letter-spacing:-1px;color:var(--green)}
.ball{display:inline-flex;align-items:center;justify-content:center;width:37px;height:37px;border-radius:50%;background:#273555;margin:4px;font-weight:700}
.ball.boundary{background:#116b68}.ball.wicket{background:#8a354e}.notice{padding:13px 15px;border-left:3px solid var(--gold);background:linear-gradient(100deg,#302b3d,#1b243b);border-radius:9px;margin:12px 0}
ul{padding-left:20px}li{margin:8px 0}.hidden{display:none!important}
#screen{min-height:55vh;animation:pageEnter .22s ease-out}
@keyframes pageEnter{from{opacity:.35;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
nav{position:sticky;top:0;z-index:20;padding:10px 0;background:rgba(9,13,27,.94);backdrop-filter:blur(12px);border-bottom:1px solid #303b6040}
html{scroll-behavior:smooth;scroll-padding-top:80px}
footer{padding:25px;text-align:center;color:var(--muted);font-size:12px}
nav button{border-radius:999px;padding:10px 15px;background:#151d34}
.offer-card{margin:14px 0!important;border-color:#39466e;background:linear-gradient(120deg,rgba(28,39,70,.98),rgba(17,24,43,.98));position:relative;overflow:hidden}
.offer-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--violet),var(--green))}
.offer-card h3{font-size:18px;letter-spacing:.1px}
.offer-status{display:inline-flex;align-items:center;gap:6px;border:1px solid #4c5a7f;background:#202a47;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:750;white-space:nowrap}
.offer-status:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}
.offer-status.accepted:before{background:var(--green)}.offer-status.declined:before,.offer-status.expired:before{background:#ff6f91}.offer-status.counter:before{background:var(--violet)}
.offer-meta{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 12px}.offer-meta span{font-size:12px;color:#c5cde4;background:#202a47;border:1px solid #354263;padding:5px 8px;border-radius:7px}
.offer-card .grid{gap:10px}.benefits-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.benefit-option{display:flex;align-items:center;gap:8px;padding:9px;background:#1b2642;border:1px solid #354263;border-radius:9px;color:var(--white)}.benefit-option input{width:auto;accent-color:var(--green)}
@media(min-width:900px){.offer-card .offer-main{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;align-items:start}.offer-card .offer-terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px}.offer-card .offer-main>.notice,.offer-card .offer-main>.panel,.offer-card .offer-main>.actions{grid-column:1/-1}}

@media(max-width:600px){.wrap{padding:11px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}h1{font-size:21px}.stat,.panel{padding:12px}nav button{flex:1}}
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding:0">
    <div style="color:var(--green);font-size:12px;letter-spacing:2px;font-weight:800">YOUR JOURNEY. YOUR LEGACY.</div>
    <h1>🏏 Beyond the Boundary</h1>
    <div class="muted">An Indian Cricket Career Simulation</div>
  </div>
</header>
<main class="wrap">
<div id="setup" class="panel">
  <h2>Begin your cricket journey</h2>
  <p class="muted">Start as an aspiring local cricketer. Train, compete, earn recognition and work towards professional cricket.</p>
  <form id="createForm" class="stack">
    <label>Player name<input id="playerName" required maxlength="35" placeholder="Enter your cricket name"></label>
    <div class="grid">
      <label>Hometown<input id="town" required placeholder="e.g. Bengaluru"></label>
      <label>Age<select id="age"><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option></select></label>
      <label>Player role<select id="role"><option>Batter</option><option>Bowler</option><option>All-rounder</option><option>Wicketkeeper-batter</option></select></label>
      <label>Batting hand<select id="hand"><option>Right-handed</option><option>Left-handed</option></select></label>
      <label>Bowling style<select id="bowl"><option>Right-arm fast</option><option>Left-arm fast</option><option>Medium pace</option><option>Off-spin</option><option>Leg-spin</option><option>Left-arm orthodox</option><option>Chinaman</option></select></label>
      <label>Starting background<select id="background"><option value="800">Financially constrained</option><option value="1800">Middle-income</option><option value="3500">Financially comfortable</option></select></label>
    </div>
    <button class="primary" type="submit">Create my player →</button>
  </form>
</div>
<div id="game" class="hidden">
  <div id="topStats" class="stats"></div>
  <nav id="nav"></nav>
  <div id="screen"></div>
</div>
</main>
<footer>Beyond the Boundary · Independent fictional career simulation</footer>
<script>
const $=id=>document.getElementById(id);
const fresh=()=>({name:"",town:"",age:16,role:"Batter",hand:"Right-handed",bowl:"Right-arm fast",cash:800,stage:0,day:1,fitness:85,morale:70,rep:0,form:0,skills:{bat:35,bowl:25,field:35,fit:35},matches:0,runs:0,wickets:0,best:0,history:[],sponsors:0,training:0,match:null,notice:"Welcome! Your career begins in local cricket.",career:"Local cricket"});
let p,tab="Home";
const stages=[
{name:"Local Cricket",need:0,desc:"Prove yourself in local and gully cricket."},
{name:"Club & District Cricket",need:60,desc:"Build consistency and attract district-level attention."},
{name:"State Age-Group Cricket",need:140,desc:"Compete for a place in the state age-group pathway."},
{name:"Senior Domestic Cricket",need:260,desc:"Earn opportunities in senior domestic cricket, including the Ranji Trophy."},
{name:"IPL Opportunity",need:410,desc:"Impress franchise scouts and compete for an IPL contract."},
{name:"India A",need:590,desc:"Show that you can perform against high-quality opposition."},
{name:"Team India",need:800,desc:"Pursue selection for India's Test, ODI and T20I teams."}
];
function save(){try{localStorage.setItem("btb-career-v1",JSON.stringify(p))}catch(e){}}
function load(){try{const x=localStorage.getItem("btb-career-v1");if(x){const q=JSON.parse(x);if(q&&q.skills&&Array.isArray(q.history)&&Number.isFinite(q.cash)){q.wickets=Number(q.wickets)||0;q.bowlingOvers=Number(q.bowlingOvers)||0;q.bowlingRunsConceded=Number(q.bowlingRunsConceded)||0;q.catches=Number(q.catches)||0;q.battingBalls=Number(q.battingBalls)||0;q.fours=Number(q.fours)||0;q.sixes=Number(q.sixes)||0;q.form=Number(q.form)||0;if(q.match&&!q.match.formatId)q.match=null;return q}}}catch(e){}return null}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function avg(){return Math.round((p.skills.bat+p.skills.bowl+p.skills.field+p.skills.fit)/4)}
function money(n){return "₹"+Math.round(n).toLocaleString("en-IN")}
function button(text,fn,primary=false,disabled=false){return `<button class="${primary?"primary":""}" ${disabled?"disabled":""} onclick="${fn}">${text}</button>`}
function bar(label,val){return `<div><div style="display:flex;justify-content:space-between"><span>${label}</span><b>${val}/100</b></div><div class="bar"><span style="width:${Math.max(0,Math.min(100,val))}%"></span></div></div>`}
function note(){return p.notice?`<div class="notice">${esc(p.notice)}</div>`:""}
function render(){
$("setup").classList.add("hidden");$("game").classList.remove("hidden");
$("topStats").innerHTML=[
["Player",p.name],["Career stage",stages[p.stage].name],["Overall",avg()+"/100"],["Balance",money(p.cash)]
].map(([a,b])=>`<div class="stat"><span class="muted">${a}</span><b>${esc(b)}</b></div>`).join("");
$("nav").innerHTML=["Home","Training","Match","Career","Offers","Calendar","Finances","Profile"].map(t=>`<button class="${tab===t?"active":""}" onclick="go('${t}')">${t}</button>`).join("");
const views={Home:home,Training:training,Match:matchView,Career:career,Offers:offers,Calendar:calendarView,Finances:finances,Profile:profile};
$("screen").innerHTML=views[tab]();
}
function go(t){tab=t;render();window.scrollTo({top:0,behavior:"smooth"})}
function home(){return `${note()}<div class="panel"><div class="muted">DAY ${p.day} · ${esc(p.town)}</div><h2>Welcome back, ${esc(p.name)} 👋</h2><p>Your journey to professional cricket starts with one good performance at a time.</p><div class="grid"><div>${bar("Fitness",p.fitness)}${bar("Confidence",p.morale)}${bar("Reputation",Math.min(100,p.rep))}</div><div><h3>Career objective</h3><p>${esc(stages[p.stage].desc)}</p><p class="muted">Career score: ${p.rep} · Matches: ${p.matches}</p>${button("Train today","go('Training')",true)} ${button("Play a match","go('Match')")}</div></div></div><div class="grid" style="margin-top:12px"><div class="panel"><h3>📈 Career statistics</h3><p>Runs scored: <b>${p.runs}</b></p><p>Wickets: <b>${p.wickets}</b></p><p>Highest score: <b>${p.best}</b></p><p>Training sessions: <b>${p.training}</b></p></div><div class="panel"><h3>📰 Latest career update</h3><p>${esc(p.history[0]||"Your local cricket journey is waiting to begin.")}</p><p class="muted">Keep training and playing to attract attention.</p></div></div>`}
function training(){return `${note()}<div class="panel"><h2>Training centre</h2><p class="muted">Train once per in-game day. Training costs money and may reduce fitness.</p><div class="grid">${[
["Batting nets","bat",120,"Improve technique, timing and shot selection."],["Bowling practice","bowl",120,"Improve control, variation and wicket-taking ability."],["Fielding drills","field",80,"Improve catching, throwing and ground fielding."],["Fitness session","fit",100,"Improve strength, speed and conditioning."]
].map(([n,k,c,d])=>`<div class="panel"><h3>${n}</h3><p class="muted">${d}</p><p>Fee: ${money(c)}</p>${bar(k==="bat"?"Batting":k==="bowl"?"Bowling":k==="field"?"Fielding":"Fitness",p.skills[k])}${button("Start session",`train('${k}',${c})`,true,p.cash<c||p.fitness<15)}</div>`).join("")}</div><div class="panel" style="margin-top:12px"><h3>Recovery</h3><p>Take a rest day to restore fitness and confidence.</p>${button("Rest and recover","rest()")}</div></div>`}
function train(k,c){if(p.cash<c||p.fitness<15)return;p.cash-=c;p.skills[k]=Math.min(100,p.skills[k]+(p.skills[k]<60?4:2));p.fitness=Math.max(0,p.fitness-8);p.training++;p.day++;p.notice="Training completed. Your "+k+" skill improved.";const priorNotice=p.notice;if(receiveTeamOffers(false)===false)p.notice=priorNotice;save();render()}
function rest(){p.fitness=Math.min(100,p.fitness+22);p.morale=Math.min(100,p.morale+5);p.day++;p.notice="Recovery day completed. You feel fresher.";const priorNotice=p.notice;if(receiveTeamOffers(false)===false)p.notice=priorNotice;save();render()}
function availableFormats(){
  if(p.stage===0)return [{id:"local10",name:"Local 10-over cricket",overs:10,kind:"Limited overs"}];
  if(p.stage===1)return [{id:"t20",name:"Club T20",overs:20,kind:"T20"},{id:"local40",name:"Club one-day cricket",overs:40,kind:"One-day"}];
  if(p.stage===2)return [{id:"t20",name:"State T20",overs:20,kind:"T20"},{id:"listA",name:"State one-day cricket",overs:50,kind:"List A"}];
  if(p.stage===3)return [{id:"t20",name:"Senior domestic T20",overs:20,kind:"T20"},{id:"listA",name:"Senior domestic one-day",overs:50,kind:"List A"},{id:"firstClass",name:"First-class cricket",overs:90,kind:"Multi-day"}];
  return [{id:"t20",name:"Professional T20",overs:20,kind:"T20"},{id:"listA",name:"Professional one-day",overs:50,kind:"List A"},{id:"firstClass",name:"First-class cricket",overs:90,kind:"Multi-day"}];
}
function matchView(){
  if(p.match)return matchLive();
  const formats=availableFormats();
  const selected=formats.some(f=>f.id===p.nextMatchFormat)?p.nextMatchFormat:formats[0].id;
  return `${note()}<div class="panel"><div class="muted">MATCH CENTRE · CAREER SIMULATION</div><h2>Match day 🏏</h2><p>Simulate a complete match with one click. Your skills, form, fitness, role, opponent strength and chosen format influence the scorecard and result. No ball-by-ball play is required.</p><div class="grid"><div><h3>Your team</h3><p>${esc(p.town)} XI</p><p>Role: ${esc(p.role)}</p><p>Batting: ${p.skills.bat}/100 · Bowling: ${p.skills.bowl}/100</p><p>Fitness: ${p.fitness}/100 · Form: ${p.form||0}</p></div><div><h3>Match setup</h3><label>Competition format<select id="matchFormat" onchange="setMatchFormat(this.value)">${formats.map(f=>`<option value="${f.id}" ${f.id===selected?"selected":""}>${esc(f.name)} (${f.overs} overs)</option>`).join("")}</select></label><p class="muted">Formats available depend on your current career stage. Match lengths are simulated; multi-day matches use a condensed innings model.</p></div></div>${button("Simulate full match →","startMatch()",true,p.fitness<10)}<p class="muted">The simulation records batting, bowling and fielding figures, the opponent's innings, the result and career progression.</p></div>`;
}
function setMatchFormat(id){p.nextMatchFormat=id;save();render()}
function randInt(max){return Math.floor(Math.random()*max)}
function simulateInnings(overs,batSkill,bowlSkill,fitness,aggression=1){
  const ballsMax=overs*6;let runs=0,wickets=0,balls=0,fours=0,sixes=0,extras=0,batRuns=0,legalBalls=0,batBalls=0;
  const dismissals=["caught","bowled","lbw","run out","stumped"];
  const wicketChance=Math.max(.025,Math.min(.16,.095-(batSkill-50)*.00065+(bowlSkill-50)*.00055+(100-fitness)*.00025));
  while(legalBalls<ballsMax&&wickets<10){
    balls++;let r=Math.random();
    if(r<wicketChance){wickets++;batBalls++;legalBalls++;continue;}
    if(r<.055){runs++;extras++;continue;} // wide/no-ball style extra; doesn't consume a legal ball
    const boundaryChance=Math.min(.23,Math.max(.06,.10+(batSkill-40)*.0015))*aggression;
    let scored;
    if(r<boundaryChance)scored=Math.random()<.72?4:6;
    else if(r<.34)scored=2;
    else if(r<.61)scored=1;
    else scored=0;
    runs+=scored;batRuns+=scored;batBalls++;legalBalls++;
    if(scored===4)fours++;if(scored===6)sixes++;
  }
  const oversText=Math.floor(legalBalls/6)+"."+(legalBalls%6);
  return {runs,wickets,balls:legalBalls,overs:oversText,fours,sixes,extras,batRuns,batBalls,allOut:wickets>=10};
}
function playerMatchBatting(overs,skill,fitness,role,form){
  const isBatter=role==="Batter"||role==="Wicketkeeper-batter"||role==="All-rounder";
  const opportunity=isBatter?.92:.58;
  if(Math.random()>opportunity)return {played:false,runs:0,balls:0,fours:0,sixes:0,dismissal:"Did not bat"};
  const maxBalls=Math.max(6,Math.round(overs*6*(role==="Bowler"?.35:role==="All-rounder"?.65:1)));
  const ability=Math.max(8,Math.min(100,skill+(form||0)*.6+(fitness-70)*.12));
  const balls=Math.max(1,Math.min(maxBalls,Math.round((maxBalls*(.12+Math.random()*.24))*(.7+ability/120))));
  const expected=balls*(.65+ability/42)*(.78+fitness/400);
  let runs=Math.max(0,Math.round(expected*(.35+Math.random()*1.2)));
  if(Math.random()<Math.max(.12,.48-ability*.003))runs=Math.round(runs*.45);
  const fours=Math.min(Math.floor(runs/4),randInt(Math.max(1,Math.floor(runs/4)+1)));
  const sixes=Math.min(Math.floor(Math.max(0,runs-fours*4)/6),randInt(3));
  const out=Math.random()<Math.max(.12,.48-ability*.003);
  return {played:true,runs,balls,fours,sixes,dismissal:out?(["caught","bowled","lbw","run out","stumped"][randInt(5)]):"Not out"};
}
function simulateFullMatch(formatId){
  const formats=availableFormats();const format=formats.find(f=>f.id===formatId)||formats[0];
  const role=p.role;const fit=Math.max(5,Math.min(100,p.fitness));const form=Number(p.form)||0;
  const playerBat=playerMatchBatting(format.overs,p.skills.bat,fit,role,form);
  const bowlingRole=role==="Bowler"||role==="All-rounder";
  const playerBowls=bowlingRole&&Math.random()<(role==="Bowler"?.95:.72);
  const maxPlayerOvers=format.overs===10?2:format.overs===20?4:format.overs===40?6:format.overs===50?10:18;
  const playerOvers=playerBowls?Math.max(1,Math.min(maxPlayerOvers,Math.round(maxPlayerOvers*(.45+Math.random()*.5)))):0;
  const playerWickets=playerBowls?Math.min(5,randInt(3)+(p.skills.bowl>=65?1:0)+(Math.random()<.12?1:0)):0;
  const playerRunsConceded=playerBowls?Math.max(playerWickets*4,Math.round(playerOvers*(5.4+(100-p.skills.bowl)*.025+Math.random()*2.2))):0;
  const playerMaidens=playerBowls&&playerOvers>=4&&Math.random()<.12?1:0;
  const playerCatches=Math.random()<(p.skills.field/100)*.35?1:0;
  const teamSkill=(p.skills.bat+p.skills.bowl+p.skills.field)/3;
  const ownBatters=[{name:p.name,...playerBat}];
  let ownRuns=playerBat.runs, ownWickets=playerBat.dismissal!=="Not out"&&playerBat.played?1:0;
  for(let i=1;i<11;i++){
    if(ownWickets>=10){ownBatters.push({name:"Batter "+(i+1),played:false,runs:0,balls:0,fours:0,sixes:0,dismissal:"Did not bat"});continue;}
    const balls=Math.max(1,randInt(Math.max(2,Math.round(format.overs*6/5))));
    const runs=Math.max(0,Math.round((.4+Math.random()*1.4)*(teamSkill/10)*Math.sqrt(balls)));
    const out=Math.random()<(.24+(100-teamSkill)*.001);
    ownBatters.push({name:["Opener","No. 3","Middle-order batter","Finisher","Lower-order batter","All-rounder","Wicketkeeper","Bowler 1","Bowler 2","Bowler 3"][i-1],played:true,runs,balls,fours:Math.floor(runs/5),sixes:Math.floor(runs/14),dismissal:out?"out":"Not out"});
    ownRuns+=runs;if(out)ownWickets++;
  }
  ownWickets=Math.min(10,ownWickets);
  const ownExtras=randInt(Math.max(2,Math.round(format.overs*.7)));
  ownRuns+=ownExtras;
  const opponentSkill=42+randInt(24);
  const opponentOvers=Math.max(4,Math.min(format.overs,Math.round(format.overs*(.62+Math.random()*.38))));
  const opponent=simulateInnings(opponentOvers,opponentSkill,p.skills.bowl,fit,.9+Math.random()*.2);
  const opponentRuns=opponent.runs;
  const opponentWickets=Math.min(10,opponent.wickets);
  const won=ownRuns>opponentRuns,tied=ownRuns===opponentRuns;
  const result=won?`Won by ${ownRuns-opponentRuns} runs`:tied?"Match tied":`Lost by ${opponentRuns-ownRuns} runs`;
  const score={format:format.name,formatId:format.id,overs:format.overs,ownTeam:p.town+" XI",opposition:"Opposition XI",ownRuns,ownWickets,ownExtras,ownBatters,ownOvers:format.overs,opponentRuns,opponentWickets,opponentOvers:opponent.overs,result,won,tied,playerBat,playerBowls,playerOvers,playerWickets,playerRunsConceded,playerMaidens,playerCatches,opponentBatting:opponent,day:p.day,done:true};
  return score;
}
function startMatch(){
  if(p.fitness<10){p.notice="Your fitness is too low to play. Rest and recover before the match.";save();render();return;}
  p.match=simulateFullMatch(p.nextMatchFormat);p.notice="Full match simulated. Review the scorecard and complete the result to update your career.";save();render();
}
function matchLive(){
  const m=p.match;if(!m)return "";

  const b=m.playerBat;const strike=b.balls?((b.runs/b.balls)*100).toFixed(1):"0.0";
  const economy=m.playerOvers?(m.playerRunsConceded/(m.playerOvers||1)).toFixed(2):"—";

.opponentRuns}/${m.opponentWickets} in ${esc(String(m.opponentOvers))} overs · Extras included in simulated total.</p><h3>Fielding</h3><p>Catches: <b>${m.playerCatches}</b></p><h3>Match summary</h3><p>${m.won?"A positive result boosts your reputation and confidence.":m.tied?"A tied result gives both sides a point in this simulation.":"A defeat is a chance to learn; one result does not define your career."} Your form, fitness, statistics and selection standing will be updated when you complete the result.</p>${button("Complete match & update career","finishMatch()",true)}</div>`;

function finishMatch(){
  const m=p.match;if(!m||!m.done||m.completed)return;
  const b=m.playerBat;const battingRuns=b.played?b.runs:0;
  p.matches++;p.runs+=battingRuns;p.best=Math.max(p.best,battingRuns);p.wickets=(p.wickets||0)+m.playerWickets;
  p.bowlingOvers=(p.bowlingOvers||0)+m.playerOvers;p.bowlingRunsConceded=(p.bowlingRunsConceded||0)+m.playerRunsConceded;p.catches=(p.catches||0)+m.playerCatches;
  p.battingBalls=(p.battingBalls||0)+(b.played?b.balls:0);p.fours=(p.fours||0)+(b.played?b.fours:0);p.sixes=(p.sixes||0)+(b.played?b.sixes:0);
  const impact=Math.round(battingRuns/8)+m.playerWickets*4+m.playerCatches*2+(m.won?5:m.tied?2:0);
  p.rep+=Math.max(1,impact);p.form=Math.max(-20,Math.min(20,Math.round((p.form||0)*.65+(battingRuns-20)/12+m.playerWickets*2+(m.won?2:-1))));
  p.skills.bat=Math.min(100,p.skills.bat+(battingRuns>=40?2:battingRuns>=15?1:0));
  if(m.playerWickets>0)p.skills.bowl=Math.min(100,p.skills.bowl+1);
  if(m.playerCatches>0)p.skills.field=Math.min(100,p.skills.field+1);
  const appearanceFee=p.stage>=3?1500:p.stage>=2?500:p.stage>=1?200:100;
  const performanceBonus=Math.min(1000,battingRuns*3+m.playerWickets*80+(m.won?100:0));
  p.cash+=appearanceFee+performanceBonus;p.morale=Math.max(0,Math.min(100,p.morale+(m.won?6:m.tied?2:-3)+(battingRuns>=30?3:0)));
  p.fitness=Math.max(0,p.fitness-(m.overs>=50?18:m.overs>=20?12:8));p.day+=m.formatId==="firstClass"?4:1;
  p.history.unshift(`${m.format}: ${battingRuns}${b.played?" runs":" (did not bat)"}, ${m.playerWickets} wicket(s), ${m.playerCatches} catch(es). ${m.result}. Earned ${money(appearanceFee+performanceBonus)}.`);
  p.history=p.history.slice(0,20);m.completed=true;const previousStage=p.stage;checkStage();const offersArrived=receiveTeamOffers(p.stage!==previousStage);p.notice=offersArrived?"A team has contacted you with a new opportunity. Check Offers.":p.stage!==previousStage?"Career milestone reached! Your new level may attract more teams.":`Match recorded: ${m.result}. Career statistics, form, fitness and finances updated.`;save();render();
}

function checkStage(){
  const requirements = [
    {matches:0, runs:0, wickets:0, fitness:0},
    {matches:3, runs:20, wickets:0, fitness:25},
    {matches:6, runs:50, wickets:1, fitness:35},
    {matches:10, runs:100, wickets:3, fitness:45},
    {matches:15, runs:180, wickets:5, fitness:55},
    {matches:20, runs:250, wickets:8, fitness:65},
    {matches:25, runs:350, wickets:12, fitness:75}
  ];

  while(p.stage < stages.length - 1){
    const nextStage = p.stage + 1;
    const req = requirements[nextStage];

    const eligible =
      p.rep >= stages[nextStage].need &&
      p.matches >= req.matches &&
      p.runs >= req.runs &&
      ((p.role === "Bowler" || p.role === "All-rounder") ? p.wickets >= req.wickets : true) &&
      p.fitness >= req.fitness;

    if(!eligible) break;

    p.stage = nextStage;
    p.career = stages[p.stage].name;
    p.notice = "Selection milestone unlocked: " +
      p.career +
      "! Your experience, performance and fitness meet the game requirements.";
  }
}

function ensureOffers(){
  if(!Array.isArray(p.offers)) p.offers=[];
  if(!Number.isFinite(p.nextOfferId)) p.nextOfferId=1;
}

function receiveTeamOffers(force=false){

  if(open>=5)return false;

      {league:"Big Bash League",team:"Melbourne Harbour",pay:2000000,maxPay:2800000,bonus:200000,matches:6,maxMatches:12,duration:"One BBL season",support:"Travel and accommodation"},
      {league:"SA20",team:"Cape Lions",pay:1800000,maxPay:2500000,bonus:180000,matches:6,maxMatches:12,duration:"One SA20 season",support:"Performance and recovery programme"},
      {league:"ILT20",team:"Desert Falcons",pay:2200000,maxPay:3000000,bonus:250000,matches:6,maxMatches:12,duration:"One ILT20 season",support:"Medical and fitness support"},
      {league:"Caribbean Premier League",team:"Island Mariners",pay:1600000,maxPay:2200000,bonus:150000,matches:5,maxMatches:10,duration:"One CPL season",support:"Travel and accommodation"},
      {league:"Bangladesh Premier League",team:"Dhaka Thunder",pay:1000000,maxPay:1500000,bonus:100000,matches:5,maxMatches:10,duration:"One BPL season",support:"Specialist coaching"},
      {league:"Lanka Premier League",team:"Colombo Comets",pay:800000,maxPay:1200000,bonus:80000,matches:5,maxMatches:10,duration:"One LPL season",support:"Recovery and fitness support"},
      {league:"The Hundred",team:"London Phoenix",pay:2000000,maxPay:2800000,bonus:200000,matches:5,maxMatches:10,duration:"One tournament",support:"Professional training facilities"}
    ];
  }

  const available=pool.filter(item=>{

function acceptOffer(id,useCounter){
  ensureOffers();
  const o=p.offers.find(x=>x.id===id);
  if(!o || !["Pending","Counter received"].includes(o.status))return;

  const terms=useCounter?o.counter:{
    pay:o.pay,
    bonus:o.bonus,
    matches:o.matches,
    duration:o.duration,
    support:o.support,
    role:o.role
  };

  if(!terms)return;

  const availability=checkAvailability(o.startDate,o.endDate);

  if(!availability.available){
    p.notice="Offer cannot be accepted: "+availability.reason+
      " Negotiate different dates or decline the offer.";
    save();
    render();
    return;
  }

  const sameLeague=p.offers.some(x=>
    x.id!==o.id && x.status==="Accepted" && x.league===o.league
  );

  if(sameLeague){
    p.notice="You already accepted an offer in this league. Decline or finish that contract before accepting another.";
    save();render();return;
  }

  o.pay=terms.pay;
  o.bonus=terms.bonus;
  o.matches=terms.matches;
  o.support=terms.support;
  o.role=terms.role;
  o.status="Accepted";
  const calendarResult=addCalendarEvent(
    o.team+" - "+o.league,
    o.startDate,
    o.endDate,
    "Contract"
  );

  if(!calendarResult.success){
    o.status=useCounter?"Counter received":"Pending";
    p.notice="Contract not accepted: "+calendarResult.reason;
    save();
    render();
    return;
  }

  o.counter=null;
  p.cash+=terms.bonus;
  p.rep+=3;
  p.history.unshift("Accepted a contract with "+o.team+" in "+o.league+".");
  p.history=p.history.slice(0,20);
  p.notice="Contract accepted! Signing bonus credited: "+money(terms.bonus)+".";
  save();render();
}

function declineOffer(id){
  ensureOffers();
  const o=p.offers.find(x=>x.id===id);
  if(!o || !["Pending","Counter received"].includes(o.status))return;
  o.status="Declined";
  o.counter=null;
  p.notice="You declined the offer from "+o.team+".";
  save();render();
}

function negotiateOffer(id){
  ensureOffers();
  const o=p.offers.find(x=>x.id===id);
  if(!o || !["Pending","Counter received"].includes(o.status))return;
  p.negotiatingOfferId=p.negotiatingOfferId===id?null:id;
  save();render();
}

function submitCounteroffer(id){
  ensureOffers();
  const o=p.offers.find(x=>x.id===id);
  if(!o || o.status!=="Pending")return;

  const pay=Number(document.getElementById("offerPay"+id).value);
  const bonus=Number(document.getElementById("offerBonus"+id).value);
  const matches=Number(document.getElementById("offerMatches"+id).value);
  const role=document.getElementById("offerRole"+id).value;
  const support=[...document.querySelectorAll(`input[name="offerBenefits${id}"]:checked`)].map(el=>el.value);

  if(!Number.isFinite(pay)||!Number.isFinite(bonus)||!Number.isFinite(matches)||pay<0||bonus<0||matches<1||pay>100000000){
    alert("Enter valid contract amounts and a valid number of matches.");
    return;
  }

  o.negotiations++;
  p.negotiatingOfferId=null;

  const acceptable =
    pay<=o.maxPay &&
    bonus<=o.maxPay*.25 &&
    matches<=o.maxMatches;

  if(acceptable){
    o.counter={pay,bonus,matches,role,support,duration:o.duration};
    o.status="Counter received";
    o.lastResponse="The team has agreed to your requested terms.";
    p.notice="Good news! "+o.team+" accepted your proposed contract terms.";
  }else{
    o.counter={
      pay:o.maxPay,
      bonus:Math.min(o.bonus,o.maxPay*.25),
      matches:o.maxMatches,
      role:o.role,
      support:Array.isArray(o.support)?o.support:[o.support],
      duration:o.duration
    };
    o.status="Counter received";
    o.lastResponse="The team cannot meet all your demands. It has proposed revised terms within its budget.";
    p.notice=o.team+" has returned with a revised offer. Review its counteroffer.";
  }

  save();render();
}

function acceptCounter(id){acceptOffer(id,true)}

function withdrawCounter(id){
  const o=p.offers.find(x=>x.id===id);
  if(!o || o.status!=="Counter received")return;
  o.status="Pending";
  o.counter=null;
  p.notice="The team's counteroffer was set aside. You can negotiate again or accept the original terms.";
  save();render();
}

        <label>Requested signing bonus (₹)<input id="offerBonus${o.id}" type="number" min="0" value="${o.bonus}"></label>
        <label>Guaranteed matches<select id="offerMatches${o.id}">${[Math.max(1,o.matches-1),o.matches,Math.min(o.maxMatches,o.matches+1),o.maxMatches].filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>a-b).map(v=>`<option value="${v}" ${v===o.matches?"selected":""}>${v}</option>`).join("")}</select></label>

<div class="field-group">
  <label>Additional contract benefits (select all that apply)</label>
  <div class="benefits-list">
    ${[
      "Specialist coaching",
      "Travel and accommodation",
      "Medical insurance",
      "Rehabilitation support",
      "Family travel support",
      "Training facilities",
      "Equipment allowance",
      "Performance incentives"
    ].map((benefit,i)=>`
      <label class="benefit-option">
        <input
          type="checkbox"
          name="offerBenefits${o.id}"
          value="${esc(benefit)}"
          ${(Array.isArray(o.support)?o.support:[o.support]).includes(benefit) ? "checked" : ""}
        >
        ${esc(benefit)}
      </label>
    `).join("")}
  </div>
</div>
        <p class="muted">Teams may accept your proposal or return a counteroffer within their budget.</p>
        <div class="actions">${button("Send counteroffer","submitCounteroffer("+o.id+")",true)} ${button("Cancel","negotiateOffer("+o.id+")")}</div>
      </div>`:""}
      ${o.status==="Pending"?`<div class="actions">${button("Accept offer","acceptOffer("+o.id+",false)",true)} ${button("Negotiate","negotiateOffer("+o.id+")")} ${button("Decline","declineOffer("+o.id+")")}</div>`:""}
      ${o.status==="Accepted"?`<div class="notice">Contract accepted. Signing bonus credited; the full contract amount is not paid immediately.</div>`:""}
      </div>

  }).join("");

  return `${note()}<div class="panel">
    <h2>Offers & Contract Negotiations</h2>

    <div class="grid">
      <div class="stat"><span class="muted">Open offers</span><b>${active.length}</b></div>
      <div class="stat"><span class="muted">Accepted contracts</span><b>${p.offers.filter(o=>o.status==="Accepted").length}</b></div>

    <div class="notice">📨 <b>Team-initiated offers</b><br>There is no search button. Teams send offers to your inbox when they are interested in your player.</div>
  </div>
  ${cards||`<div class="panel" style="margin-top:12px"><p>No team offers have arrived yet. Continue training, playing matches and progressing your career. Interested teams will contact you automatically.</p></div>`}`;
}

function calendarView(){
  ensureCalendar();

  const today=new Date();
  const monthNames=[
    "January","February","March","April","May","June",
    "July","August","September","October","November","December"
  ];

  const year=Number(document.getElementById("calYear")?.value)||today.getFullYear();
  const month=Number(document.getElementById("calMonth")?.value ?? today.getMonth());
  const first=new Date(year,month,1);
  const daysInMonth=new Date(year,month+1,0).getDate();
  const pad=first.getDay();

  let cells="";
  for(let i=0;i<pad;i++) cells+="<div></div>";

  for(let day=1;day<=daysInMonth;day++){
    const date=year+"-"+String(month+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    const events=p.calendar.filter(e=>e.startDate<=date&&e.endDate>=date);
    cells+=`<div class="panel" style="padding:7px;min-height:65px">
      <b>${day}</b>
      ${events.map(e=>`<div style="font-size:10px;color:var(--green);overflow-wrap:anywhere">${esc(e.title)}</div>`).join("")}
    </div>`;
  }

  return `${note()}
    <div class="panel">
      <h2>📅 Career Calendar</h2>
      <p class="muted">Review contracts, matches, training, travel and recovery commitments.</p>
      <div class="grid">
        <label>Month
          <select id="calMonth" onchange="go('Calendar')">
            ${monthNames.map((name,i)=>`<option value="${i}" ${i===month?"selected":""}>${name}</option>`).join("")}
          </select>
        </label>
        <label>Year
          <input id="calYear" type="number" value="${year}" min="2020" max="2100" onchange="go('Calendar')">
        </label>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px">
        ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="muted" style="text-align:center;font-size:11px">${d}</div>`).join("")}
        ${cells}
      </div>
    </div>
    <div class="panel" style="margin-top:12px">
      <h3>Scheduled commitments</h3>
      ${p.calendar.length?p.calendar.map(e=>`<div style="border-bottom:1px solid var(--line);padding:10px 0">
        <b>${esc(e.title)}</b>
        <p class="muted">${esc(e.type)} · ${esc(e.startDate)} to ${esc(e.endDate)}</p>
      </div>`).join(""):"<p class='muted'>No commitments scheduled yet. We'll connect this calendar to incoming offers next.</p>"}
    </div>`;
}

function ensureCalendar(){
  if(!Array.isArray(p.calendar)) p.calendar=[];
  if(!Number.isFinite(p.nextCalendarId)) p.nextCalendarId=1;
}

function dateOverlap(startA,endA,startB,endB){
  return startA<=endB && startB<=endA;
}

function checkAvailability(startDate,endDate,ignoreId=null){
  ensureCalendar();

  const start=new Date(startDate+"T00:00:00Z");
  const end=new Date(endDate+"T00:00:00Z");

  if(isNaN(start.getTime())||isNaN(end.getTime())||end<start){
    return {available:false,reason:"Invalid date range."};
  }

  const days=(end-start)/86400000+1;
  if(days>120){
    return {available:false,reason:"A single commitment cannot exceed 120 days."};
  }

  for(const event of p.calendar){
    if(event.id===ignoreId) continue;

    if(dateOverlap(startDate,endDate,event.startDate,event.endDate)){
      return {
        available:false,
        reason:"Overlaps with "+event.title+
          " ("+event.startDate+" to "+event.endDate+")."
      };
    }
  }

  const restDays=Number.isFinite(p.requiredRestDays)?p.requiredRestDays:2;
  const recoveryStart=new Date(start);
  recoveryStart.setUTCDate(recoveryStart.getUTCDate()-restDays);
  const recoveryEnd=new Date(end);
  recoveryEnd.setUTCDate(recoveryEnd.getUTCDate()+restDays);

  const recoveryConflict=p.calendar.find(event=>
    event.id!==ignoreId &&
    dateOverlap(
      recoveryStart.toISOString().slice(0,10),
      recoveryEnd.toISOString().slice(0,10),
      event.startDate,
      event.endDate
    )
  );

  if(recoveryConflict){
    return {
      available:false,
      reason:"Insufficient recovery time near "+recoveryConflict.title+"."
    };
  }

  return {available:true,reason:"Dates are available with the required recovery buffer."};
}

function addCalendarEvent(title,startDate,endDate,type="Commitment"){
  ensureCalendar();

  const check=checkAvailability(startDate,endDate);
  if(!check.available){
    return {success:false,reason:check.reason};
  }

  p.calendar.push({
    id:p.nextCalendarId++,
    title,
    startDate,
    endDate,
    type
  });

  save();
  return {success:true,reason:"Calendar commitment added."};
}
